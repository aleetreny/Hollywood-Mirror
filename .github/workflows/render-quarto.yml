name: Render Quarto HTML

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/**"
      - "data/processed/**"
      - ".github/workflows/render-quarto.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow plotly scikit-learn scipy jupyter

      - name: Render standalone HTML
        working-directory: analysis
        run: quarto render galaxia.qmd --to html

      - name: Locate rendered report
        run: find . -type f -name "galaxia.html" -print -exec ls -lh {} \;

      - name: Upload rendered report
        uses: actions/upload-artifact@v4
        with:
          name: hollywood-mirror-quarto-html
          path: "**/galaxia.html"
          if-no-files-found: error
          retention-days: 30
