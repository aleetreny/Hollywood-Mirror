name: Deploy Hugging Face Space

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - requirements.txt
      - requirements-web.txt
      - src/**
      - data/processed/movie_embeddings_*.npy
      - data/processed/movie_embeddings_*.txt
      - upload_hf.py
      - .github/workflows/deploy-hugging-face.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hugging-face-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment dependency
        run: python -m pip install --upgrade pip "huggingface_hub>=1,<2"

      - name: Sync Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO_ID: Imagenbomba/hollywood-mirror
          HF_COMMIT_MESSAGE: "Sync from GitHub commit ${{ github.sha }}"
        run: python upload_hf.py
